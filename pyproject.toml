[tool.poetry]
name = "elastory"
version = "0.1.0"
description = "Tools for studying long ranged —allosteric— effects in elastic networks (e.g. of proteins) on a mechanical basis."
authors = ["Maximilian Alexander Vossel <mvossel@pm.me>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.2.6"
networkx = "^3.4.2"
parmap = "^1.7.0"
scipy = "^1.15.3"
numba = "^0.61.2"
ruff = "^0.11.10"
tqdm = "^4.67.1"
ipykernel = "^6.29.2"
matplotlib = "^3.10.3"
ipywidgets = "^8.1.7"
widgetsnbextension = "^4.0.14"
jupyterthemes = "^0.20.0"
pandas = "^2.0.3"
h5py = "^3.13.0"
plotly = "^6.1.0"
rmsd = "^1.6.4"
pre-commit = "^4.2.0"
pydantic = "^2.11.4"
kaleido = "0.2.1"
pillow = "^11.2.1"
tables = "^3.10.2"
fastdtw = "^0.3.4"
seaborn = "^0.13.2"
dcor = "^0.6"
scikit-learn = "^1.6.1"
biopython = "^1.85"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
